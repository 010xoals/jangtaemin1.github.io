name: Update RE:SONG New Releases

on:
  workflow_dispatch:
  schedule:
    # KST 11:23 daily (UTC 02:23). Scheduled workflows run on the default branch only.
    - cron: "23 2 * * *"

permissions:
  contents: write

concurrency:
  group: resong-new-releases
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify YouTube key is configured
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          if [ -z "$YT_API_KEY" ]; then
            echo "YT_API_KEY GitHub Actions secret is missing or not available"
            exit 1
          fi
          echo "YouTube secret is configured (value hidden)"
      - name: Collect singles and embeddable YouTube videos
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          MUSICBRAINZ_USER_AGENT: "RESONG/0.2 (https://jangtaemin1.com; https://github.com/010xoals/jangtaemin1.github.io)"
          MAX_YOUTUBE_SEARCHES: "30"
        run: node scripts/update_new_releases.cjs
      - name: Sync verified song catalog to Supabase (when configured)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            node scripts/sync_supabase_catalog.cjs
          else
            echo "Supabase catalog sync waiting for project configuration"
          fi
      - name: Commit feed (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/new-releases.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh latest music releases"
            git push
          else
            echo "No release changes"
          fi
